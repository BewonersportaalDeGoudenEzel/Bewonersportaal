<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6f4f">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard — De Gouden Ezel</title>
<meta name="description" content="Cijfers over reparatieverzoeken en aanmeldingen op het bewonersportaal.">
<link rel="icon" href="Gouden%20Ezel.png">
<link rel="apple-touch-icon" href="Gouden%20Ezel.png">
<style>
  :root {
    --groen: #2f6f4f;
    --groen-donker: #234f38;
    --blauw: #2b5faa;
    --tekst: #1a1a1a;
    --achtergrond: #f5f6f4;
    --kaart: #ffffff;
    --rand: #d8dcd6;

    --db-bg: #15162e;
    --db-kaart: #1d1f42;
    --db-rand: #2a2c54;
    --db-tekst: #f2f3fa;
    --db-tekst-dim: #9294b8;
    --db-cyaan: #2bd4f0;
    --db-groen: #3ddc97;
    --db-rood: #f65c7a;
    --db-amber: #f6b94d;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    background: var(--achtergrond);
    color: var(--tekst);
    font-size: 17px;
    line-height: 1.6;
  }

  a { color: var(--blauw); }

  .skip-link {
    position: absolute;
    left: -999px;
    top: 0;
    background: #000;
    color: #fff;
    padding: 12px 18px;
    z-index: 100;
  }
  .skip-link:focus { left: 8px; top: 8px; }

  header {
    background: var(--groen-donker);
    color: #fff;
    padding: 24px 20px;
    text-align: center;
  }
  header .logo {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 10px;
  }
  header h1 { margin: 0; font-size: 1.4rem; }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  .terug-link {
    display: inline-block;
    margin-bottom: 16px;
    font-size: 0.95rem;
  }

  .let-op {
    background: #fff4e6;
    border: 1px solid #e8c398;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.9rem;
    margin-bottom: 20px;
  }

  .kaart {
    background: var(--kaart);
    border: 1px solid var(--rand);
    border-radius: 12px;
    padding: 20px;
  }

  .veld-groep { margin-bottom: 16px; }
  .veld-groep label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 0.95rem;
  }
  .veld-groep input {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--rand);
    border-radius: 8px;
    font-family: inherit;
  }

  button.knop {
    background: var(--groen);
    color: #fff;
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.knop:disabled { opacity: 0.6; cursor: default; }

  .status-tekst {
    margin-top: 10px;
    font-size: 0.9rem;
    color: #a33;
  }

  /* ── Het dashboard zelf: donker paneel ── */
  #dashboard-paneel {
    background: var(--db-bg);
    border-radius: 16px;
    padding: 20px 16px 26px;
    color: var(--db-tekst);
  }
  #dashboard-paneel[hidden] { display: none; }

  .db-top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .db-top h2 { margin: 0; font-size: 1.1rem; font-weight: 600; }

  .db-sectie { margin-top: 28px; }
  .db-sectie:first-of-type { margin-top: 0; }
  .db-sectie-titel {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--db-tekst);
    margin: 0 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--db-rand);
  }
  .db-sectie-bolletje {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Kaarten worden met JS verdeeld over kolommen (zie verdeelInKolommen_)
     die elk gewoon van boven naar beneden vullen — dat pakt strakker
     dan CSS-grid/columns, want er wordt naar de echte, al gerenderde
     hoogte van elke kaart gekeken i.p.v. blind te balanceren. */
  .db-grid[hidden] { display: none; }

  .db-kolommen {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .db-kolom {
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
    min-width: 0;
  }

  .db-kaart {
    background: var(--db-kaart);
    border: 1px solid var(--db-rand);
    border-radius: 16px;
    padding: 18px 20px;
    min-height: 120px;
    display: flex;
    flex-direction: column;
  }
  .db-kaart.db-wide { margin-top: 14px; }

  .db-kaartgroep { display: flex; flex-direction: column; gap: 14px; }

  .db-kaart.db-alarm {
    background: rgba(246, 92, 122, 0.12);
    border-color: rgba(246, 92, 122, 0.45);
  }
  .db-alarm-kop {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--db-rood);
  }
  .db-alarm-tekst {
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--db-rood);
  }
  .db-kaart .db-label {
    font-size: 0.75rem;
    color: var(--db-tekst-dim);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .db-groot { font-size: 2rem; font-weight: 700; line-height: 1; }
  .db-sub { font-size: 0.75rem; color: var(--db-tekst-dim); margin-top: 6px; }

  .db-twee { display: flex; gap: 22px; }
  .db-twee div { flex: 1; }
  .db-twee .g { font-size: 1.5rem; font-weight: 700; }
  .db-twee .l { font-size: 0.72rem; color: var(--db-tekst-dim); margin-top: 4px; }

  .db-lijst-item { margin-top: 10px; }
  .db-lijst-item:first-of-type { margin-top: 12px; }
  .db-lijst-kop {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    margin-bottom: 4px;
  }
  .db-lijst-kop span:last-child { color: var(--db-tekst-dim); }
  .db-balk-track { height: 6px; background: #2a2c54; border-radius: 6px; overflow: hidden; }
  .db-balk-fill { height: 100%; border-radius: 6px; }

  .db-leeg { color: var(--db-tekst-dim); font-size: 0.8rem; margin-top: 8px; }

  .db-staafgrafiek {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    height: 130px;
    margin-top: 10px;
    padding-top: 10px;
    overflow-x: auto;
  }
  .db-staaf-kolom {
    flex: 1;
    min-width: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
  }
  .db-staaf {
    width: 60%;
    max-width: 34px;
    background: linear-gradient(180deg, var(--db-cyaan), #4a7bf2);
    border-radius: 5px 5px 0 0;
    min-height: 2px;
  }
  .db-staaf-label { margin-top: 8px; font-size: 0.68rem; color: var(--db-tekst-dim); }
  .db-staaf-getal { font-size: 0.65rem; color: var(--db-tekst-dim); margin-bottom: 3px; }

  .db-taart-svg { display: block; margin: 2px auto 12px; }
  .db-taart-legenda { display: flex; flex-direction: column; gap: 5px; font-size: 0.72rem; }
  .db-legenda-item { display: flex; align-items: center; gap: 7px; }
  .db-legenda-bol { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .db-lijn-svg { display: block; margin-top: 8px; overflow: visible; }
</style>
</head>
<body>

<a class="skip-link" href="#inhoud">Ga direct naar de inhoud</a>

<header>
  <img class="logo" src="logo-ezel.png" alt="De Gouden Ezel — logo" width="100" height="100">
  <h1>Dashboard</h1>
</header>

<main id="inhoud">
  <a class="terug-link" href="index.html">← Terug naar het bewonersportaal</a>

  <p class="let-op">Deze pagina is alleen voor de bewonerscommissie. Log hieronder in met uw eigen huisnummer en pincode — dezelfde combinatie als op het portaal zelf.</p>

  <div class="kaart" id="login-kaart">
    <form id="form-login" novalidate>
      <div class="veld-groep">
        <label for="dashboard-huisnummer">Huisnummer *</label>
        <input type="text" inputmode="numeric" id="dashboard-huisnummer" required autocomplete="off">
      </div>
      <div class="veld-groep">
        <label for="dashboard-pincode">Pincode (4 cijfers) *</label>
        <input type="password" inputmode="numeric" maxlength="4" id="dashboard-pincode" required autocomplete="off">
      </div>
      <button type="submit" class="knop" id="knop-inloggen">Bekijk dashboard</button>
      <p class="status-tekst" id="login-status"></p>
    </form>
  </div>

  <div id="dashboard-paneel" hidden>
    <div class="db-top">
      <h2>Polanenflat</h2>
    </div>

    <div class="db-sectie">
      <div class="db-sectie-titel"><span class="db-sectie-bolletje" style="background:var(--db-cyaan)"></span>Reparatieverzoeken</div>
      <div class="db-grid" id="grid-reparatie"></div>
    </div>

    <div class="db-sectie">
      <div class="db-sectie-titel"><span class="db-sectie-bolletje" style="background:var(--db-groen)"></span>Aanmeldingen</div>
      <div class="db-grid" id="grid-aanmeldingen"></div>
    </div>
  </div>
</main>

<script>
  var DASHBOARD_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUZGbI-8xsC9Lb6EE4RqCc3Clxw7O4A0K5rpK4HXH2RIBFCQpumGMPkNDcRlrmKN0hAA/exec";

  var kleuren = { cyaan: "#2bd4f0", groen: "#3ddc97", amber: "#f6b94d", rood: "#f65c7a" };

  function el_(tag, klasse, tekst) {
    var e = document.createElement(tag);
    if (klasse) e.className = klasse;
    if (tekst != null) e.textContent = tekst;
    return e;
  }

  // Bundelt een paar kaarten tot één blok dat altijd bij elkaar en
  // onder elkaar blijft staan, ongeacht hoe verdeelInKolommen_ de rest
  // over de kolommen verdeelt (die ziet dit gewoon als één geheel).
  function kaartGroep_(kaarten) {
    var wrap = el_("div", "db-kaartgroep");
    kaarten.forEach(function (k) { wrap.appendChild(k); });
    return wrap;
  }

  function kaartGroot_(label, waarde, sub, kleur) {
    var kaart = el_("div", "db-kaart");
    kaart.appendChild(el_("div", "db-label", label));
    var groot = el_("div", "db-groot", String(waarde));
    if (kleur) groot.style.color = kleur;
    kaart.appendChild(groot);
    if (sub) kaart.appendChild(el_("div", "db-sub", sub));
    return kaart;
  }

  function kaartAlarm_(titel, tekst) {
    var kaart = el_("div", "db-kaart db-alarm");
    var kop = el_("div", "db-alarm-kop");
    kop.appendChild(el_("span", null, "⚠️"));
    kop.appendChild(el_("span", null, titel));
    kaart.appendChild(kop);
    kaart.appendChild(el_("div", "db-alarm-tekst", tekst));
    return kaart;
  }

  function kaartTwee_(label, a, aLabel, b, bLabel, kleurA, kleurB) {
    var kaart = el_("div", "db-kaart");
    kaart.appendChild(el_("div", "db-label", label));
    var rij = el_("div", "db-twee");
    var linksDiv = el_("div"); var links = el_("div", "g", String(a)); links.style.color = kleurA;
    linksDiv.appendChild(links); linksDiv.appendChild(el_("div", "l", aLabel));
    var rechtsDiv = el_("div"); var rechts = el_("div", "g", String(b)); rechts.style.color = kleurB;
    rechtsDiv.appendChild(rechts); rechtsDiv.appendChild(el_("div", "l", bLabel));
    rij.appendChild(linksDiv); rij.appendChild(rechtsDiv);
    kaart.appendChild(rij);
    return kaart;
  }

  function kaartLijst_(label, items, kleurenLijst) {
    var kaart = el_("div", "db-kaart");
    kaart.appendChild(el_("div", "db-label", label));
    if (!items.length) {
      kaart.appendChild(el_("div", "db-leeg", "Nog geen gegevens."));
      return kaart;
    }
    var max = Math.max.apply(null, items.map(function (i) { return i.aantal; })) || 1;
    items.forEach(function (item, i) {
      var wrap = el_("div", "db-lijst-item");
      var kop = el_("div", "db-lijst-kop");
      kop.appendChild(el_("span", null, item.label));
      kop.appendChild(el_("span", null, String(item.aantal)));
      wrap.appendChild(kop);
      var track = el_("div", "db-balk-track");
      var fill = el_("div", "db-balk-fill");
      fill.style.width = Math.max(6, Math.round((item.aantal / max) * 100)) + "%";
      fill.style.background = kleurenLijst[i % kleurenLijst.length];
      track.appendChild(fill);
      wrap.appendChild(track);
      kaart.appendChild(wrap);
    });
    return kaart;
  }

  function kaartStaafgrafiek_(label, reeks) {
    var kaart = el_("div", "db-kaart db-wide");
    kaart.appendChild(el_("div", "db-label", label));
    var grafiek = el_("div", "db-staafgrafiek");
    if (!reeks.length) {
      kaart.appendChild(el_("div", "db-leeg", "Nog geen gegevens."));
      return kaart;
    }
    var max = Math.max.apply(null, reeks.map(function (r) { return r.aantal; })) || 1;
    reeks.forEach(function (punt) {
      var kolom = el_("div", "db-staaf-kolom");
      kolom.appendChild(el_("div", "db-staaf-getal", String(punt.aantal)));
      var staaf = el_("div", "db-staaf");
      staaf.style.height = Math.max(2, Math.round((punt.aantal / max) * 100)) + "%";
      kolom.appendChild(staaf);
      var weekLabel = punt.week.indexOf("-W") > -1 ? punt.week.split("-W")[1].replace(/^0/, "W") : punt.week;
      if (weekLabel.charAt(0) !== "W") weekLabel = "W" + weekLabel;
      kolom.appendChild(el_("div", "db-staaf-label", weekLabel));
      grafiek.appendChild(kolom);
    });
    kaart.appendChild(grafiek);
    return kaart;
  }

  function svgEl_(tag, attrs) {
    var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function kaartTaart_(label, items, kleurenLijst) {
    var kaart = el_("div", "db-kaart");
    kaart.appendChild(el_("div", "db-label", label));
    if (!items.length) {
      kaart.appendChild(el_("div", "db-leeg", "Nog geen gegevens."));
      return kaart;
    }
    var totaal = items.reduce(function (s, i) { return s + i.aantal; }, 0) || 1;
    var maat = 120, straal = 44, dikte = 20;
    var omtrek = 2 * Math.PI * straal;
    var svg = svgEl_("svg", { viewBox: "0 0 " + maat + " " + maat, width: maat, height: maat, class: "db-taart-svg" });
    var achtergrond = svgEl_("circle", { cx: maat / 2, cy: maat / 2, r: straal, fill: "none", stroke: "#2a2c54", "stroke-width": dikte });
    svg.appendChild(achtergrond);
    var groep = svgEl_("g", { transform: "rotate(-90 " + (maat / 2) + " " + (maat / 2) + ")" });
    var cumulatief = 0;
    items.forEach(function (item, i) {
      var deel = item.aantal / totaal;
      var lengte = deel * omtrek;
      groep.appendChild(svgEl_("circle", {
        cx: maat / 2, cy: maat / 2, r: straal,
        fill: "none",
        stroke: kleurenLijst[i % kleurenLijst.length],
        "stroke-width": dikte,
        "stroke-dasharray": lengte + " " + (omtrek - lengte),
        "stroke-dashoffset": -cumulatief
      }));
      cumulatief += lengte;
    });
    svg.appendChild(groep);
    kaart.appendChild(svg);

    var legenda = el_("div", "db-taart-legenda");
    items.forEach(function (item, i) {
      var rij = el_("div", "db-legenda-item");
      var bol = el_("span", "db-legenda-bol");
      bol.style.background = kleurenLijst[i % kleurenLijst.length];
      rij.appendChild(bol);
      var pct = Math.round((item.aantal / totaal) * 100);
      rij.appendChild(el_("span", null, item.label + " — " + item.aantal + " (" + pct + "%)"));
      legenda.appendChild(rij);
    });
    kaart.appendChild(legenda);
    return kaart;
  }

  function kaartLijngrafiek_(label, reeks, kleur) {
    var kaart = el_("div", "db-kaart db-wide");
    kaart.appendChild(el_("div", "db-label", label));
    if (!reeks.length) {
      kaart.appendChild(el_("div", "db-leeg", "Nog geen gegevens."));
      return kaart;
    }
    var breedte = 600, hoogte = 140, padLinks = 14, padRechts = 14, padBoven = 22, padOnder = 24;
    var max = Math.max.apply(null, reeks.map(function (r) { return r.aantal; })) || 1;
    var stapX = reeks.length > 1 ? (breedte - padLinks - padRechts) / (reeks.length - 1) : 0;
    var svg = svgEl_("svg", { viewBox: "0 0 " + breedte + " " + hoogte, width: "100%", height: hoogte, class: "db-lijn-svg" });

    function puntXY(i, waarde) {
      var x = reeks.length > 1 ? padLinks + i * stapX : breedte / 2;
      var y = padBoven + (1 - waarde / max) * (hoogte - padBoven - padOnder);
      return [x, y];
    }

    var puntenTekst = reeks.map(function (r, i) { var p = puntXY(i, r.aantal); return p[0] + "," + p[1]; }).join(" ");

    var vlakPunten = padLinks + "," + (hoogte - padOnder) + " " + puntenTekst + " " + (breedte - padRechts) + "," + (hoogte - padOnder);
    svg.appendChild(svgEl_("polygon", { points: vlakPunten, fill: kleur, "fill-opacity": "0.14", stroke: "none" }));
    svg.appendChild(svgEl_("polyline", { points: puntenTekst, fill: "none", stroke: kleur, "stroke-width": "3", "stroke-linecap": "round", "stroke-linejoin": "round" }));

    reeks.forEach(function (r, i) {
      var p = puntXY(i, r.aantal);
      svg.appendChild(svgEl_("circle", { cx: p[0], cy: p[1], r: 4, fill: kleur }));
      var getal = svgEl_("text", { x: p[0], y: p[1] - 9, "text-anchor": "middle", fill: "#f2f3fa", "font-size": "11" });
      getal.textContent = String(r.aantal);
      svg.appendChild(getal);
      var weekLabel = r.week.indexOf("-W") > -1 ? r.week.split("-W")[1].replace(/^0/, "W") : r.week;
      if (weekLabel.charAt(0) !== "W") weekLabel = "W" + weekLabel;
      var labelTekst = svgEl_("text", { x: p[0], y: hoogte - 6, "text-anchor": "middle", fill: "#9294b8", "font-size": "10" });
      labelTekst.textContent = weekLabel;
      svg.appendChild(labelTekst);
    });

    kaart.appendChild(svg);
    return kaart;
  }

  function kaartCategorieGrafiek_(label, items, kleur) {
    var kaart = el_("div", "db-kaart db-wide");
    kaart.appendChild(el_("div", "db-label", label));
    if (!items.length) {
      kaart.appendChild(el_("div", "db-leeg", "Nog geen gegevens."));
      return kaart;
    }
    var stap = 64, padLinks = 18, padRechts = 18, padBoven = 24, padOnder = 74;
    var breedte = Math.max(320, padLinks + padRechts + items.length * stap);
    var hoogte = 210;
    var beschikbareHoogte = hoogte - padBoven - padOnder;
    var max = Math.max.apply(null, items.map(function (i) { return i.aantal; })) || 1;
    var svg = svgEl_("svg", { viewBox: "0 0 " + breedte + " " + hoogte, width: "100%", height: hoogte, class: "db-lijn-svg" });

    items.forEach(function (item, i) {
      var x = padLinks + i * stap;
      var barBreedte = stap * 0.55;
      var barHoogte = Math.max(2, (item.aantal / max) * beschikbareHoogte);
      var y = padBoven + (beschikbareHoogte - barHoogte);
      svg.appendChild(svgEl_("rect", { x: x, y: y, width: barBreedte, height: barHoogte, rx: 4, fill: kleur }));
      var getal = svgEl_("text", { x: x + barBreedte / 2, y: y - 6, "text-anchor": "middle", fill: "#f2f3fa", "font-size": "11" });
      getal.textContent = String(item.aantal);
      svg.appendChild(getal);
      var labelY = padBoven + beschikbareHoogte + 14;
      var labelTekst = svgEl_("text", {
        x: x + barBreedte / 2, y: labelY,
        "text-anchor": "end", fill: "#9294b8", "font-size": "10",
        transform: "rotate(-40 " + (x + barBreedte / 2) + " " + labelY + ")"
      });
      var kort = item.label.length > 20 ? item.label.slice(0, 19) + "…" : item.label;
      labelTekst.textContent = kort;
      var titel = svgEl_("title", {});
      titel.textContent = item.volledig || item.label;
      labelTekst.appendChild(titel);
      svg.appendChild(labelTekst);
    });

    kaart.appendChild(svg);
    return kaart;
  }

  // "Waar is het probleem" staat in de spreadsheet als bijv.
  // "Eigen woning - Keuken" of "Algemene ruimte - Lift". Het voorvoegsel
  // (eigen woning/algemene ruimte) staat al apart in de kaart "Waar"
  // hierboven, dus in dit staafje laten we alleen het stuk ná het
  // streepje zien — dat is namelijk de informatie die er nog niet
  // stond. Is er geen stuk ná het streepje (leeg), dan laten we die
  // hele kolom gewoon weg in plaats van een lege balk te tonen.
  function locatieLabelsVoorGrafiek_(items) {
    return (items || [])
      .map(function (item) {
        var origineel = String(item.label || "").trim();
        var match = origineel.match(/^(eigen woning|algemene ruimte)\s*[-:–—]\s*(.+)$/i);
        var kort = match ? match[2].trim() : origineel;
        return { label: kort, volledig: origineel, aantal: item.aantal };
      })
      .filter(function (item) { return item.label !== "" && item.aantal > 0; });
  }

  /**
   * Verdeelt "normale" kaarten over N nette kolommen (steeds de kaart
   * naar de op dat moment KORTSTE kolom — een 'bakstenen-muur'-indeling
   * i.p.v. CSS-grid/columns, die naar rijen resp. verwachte hoogte kijkt
   * i.p.v. de echte, al gerenderde hoogte). Brede kaarten (grafieken)
   * komen er los onder, over de volle breedte.
   */
  function verdeelInKolommen_(container, normaal, breed) {
    container.innerHTML = "";
    var kolommenWrapper = el_("div", "db-kolommen");
    container.appendChild(kolommenWrapper);

    var breedteContainer = container.clientWidth || 900;
    var aantalKolommen = Math.max(1, Math.min(4, Math.floor((breedteContainer + 14) / (230 + 14))));

    var kolommen = [];
    for (var k = 0; k < aantalKolommen; k++) {
      var kolomEl = el_("div", "db-kolom");
      kolommenWrapper.appendChild(kolomEl);
      kolommen.push({ el: kolomEl, hoogte: 0 });
    }

    normaal.forEach(function (kaart) {
      var kortste = kolommen[0];
      for (var i = 1; i < kolommen.length; i++) {
        if (kolommen[i].hoogte < kortste.hoogte) kortste = kolommen[i];
      }
      kortste.el.appendChild(kaart);
      kortste.hoogte += kaart.offsetHeight + 14;
    });

    // Laatste stap: de kortste kolommen strekken zodat alle kolommen
    // onderaan precies gelijk eindigen — de laatste kaart in zo'n
    // kolom wordt gewoon iets langer, in plaats van dat er onderaan
    // een lege strook overblijft.
    var echteHoogtes = kolommen.map(function (k) { return k.el.offsetHeight; });
    var maxHoogte = Math.max.apply(null, echteHoogtes.concat([0]));
    kolommen.forEach(function (k) {
      if (k.el.offsetHeight < maxHoogte - 2 && k.el.lastElementChild) {
        k.el.style.height = maxHoogte + "px";
        k.el.lastElementChild.style.flex = "1 1 auto";
      }
    });

    breed.forEach(function (kaart) {
      container.appendChild(kaart);
    });
  }

  // Gemiddeld aantal reparatieverzoeken per week, en of de meest
  // recente week daar boven (rood) of onder (groen) zit.
  function gemiddeldPerWeek_(reeks) {
    if (!reeks || !reeks.length) return { gemiddelde: 0, laatste: 0 };
    var som = reeks.reduce(function (s, r) { return s + r.aantal; }, 0);
    return { gemiddelde: som / reeks.length, laatste: reeks[reeks.length - 1].aantal };
  }

  // Types storing die opvallend vaak voorkomen (meer dan 5 keer, over
  // eigen woning en algemene ruimte samen) — die verdienen een eigen
  // signaalblok, ongeacht in welke ruimte ze zich voordoen.
  function opvallendeStoringTypes_(lijstA, lijstB) {
    var tellingen = {};
    (lijstA || []).concat(lijstB || []).forEach(function (item) {
      tellingen[item.label] = (tellingen[item.label] || 0) + item.aantal;
    });
    return Object.keys(tellingen)
      .map(function (naam) { return { label: naam, aantal: tellingen[naam] }; })
      .filter(function (item) { return item.aantal > 5; })
      .sort(function (a, b) { return b.aantal - a.aantal; });
  }

  function toonReparatieverzoeken_(d) {
    var grid = document.getElementById("grid-reparatie");
    var weekCijfers = gemiddeldPerWeek_(d.perWeek);
    var kleurLaatsteWeek = weekCijfers.laatste > weekCijfers.gemiddelde ? kleuren.rood
      : weekCijfers.laatste < weekCijfers.gemiddelde ? kleuren.groen
      : kleuren.amber;

    var typeStoringBlok = opvallendeStoringTypes_(d.typeStoringEigenWoning, d.typeStoringAlgemeneRuimte)
      .map(function (item) { return kaartAlarm_(item.label, item.aantal + " meldingen — opvallend veel voor één type storing"); });
    typeStoringBlok.push(kaartTaart_("Type storing — eigen woning", d.typeStoringEigenWoning, [kleuren.cyaan, kleuren.groen, kleuren.amber, kleuren.rood]));
    typeStoringBlok.push(kaartTaart_("Type storing — algemene ruimte", d.typeStoringAlgemeneRuimte, [kleuren.cyaan, kleuren.groen, kleuren.amber, kleuren.rood]));

    var normaal = [
      kaartGroot_("Reparatieverzoeken", d.totaal, "totaal ontvangen"),
      kaartTwee_("Waar", d.eigenWoning, "eigen woning", d.algemeneRuimte, "algemene ruimte", kleuren.cyaan, kleuren.groen),
      kaartGroep_(typeStoringBlok),
      kaartTwee_("Reparatieverzoeken delen", d.gedeeldTotaal, "Hoen + bewonerscommissie", d.nietGedeeldTotaal, "alleen Hoen", kleuren.groen, kleuren.amber),
      kaartGroot_("Gemiddeld per week", weekCijfers.gemiddelde.toFixed(1)),
      kaartGroot_("Laatste week", weekCijfers.laatste, "t.o.v. gemiddeld " + weekCijfers.gemiddelde.toFixed(1) + " per week", kleurLaatsteWeek),
      kaartGroot_("Aangemelde bewoners", d.aangemeldeBewoners),
      kaartGroot_("Bewoners met minstens 1 reparatieverzoek", d.metVerzoek),
      kaartGroot_("Aantal zaalreserveringen", d.zaalreserveringen),
      kaartGroot_("Aantal vragen aan de bewonerscommissie", d.vragen)
    ];

    var breed = [
      kaartCategorieGrafiek_("Waar is het probleem", locatieLabelsVoorGrafiek_(d.waarIsHetProbleem), kleuren.cyaan),
      kaartLijngrafiek_("Per week — reparatieverzoeken", d.perWeek, kleuren.cyaan)
    ];
    verdeelInKolommen_(grid, normaal, breed);
  }

  function toonAanmeldingen_(d) {
    var grid = document.getElementById("grid-aanmeldingen");
    var pct = d.totaalHuisnummers ? Math.round((d.aangemeld / d.totaalHuisnummers) * 100) : 0;
    var normaal = [
      kaartGroot_("Aangemeld op portaal", d.aangemeld + " / " + d.totaalHuisnummers, pct + "% van alle huisnummers"),
      kaartTwee_("Koop / huur", d.huurwoningen, "huurwoningen", d.koopwoningen, "koopwoningen", kleuren.cyaan, kleuren.groen),
      kaartLijst_("Voortgang huurwoningen", [
        { label: "Aangemeld", aantal: d.huurAangemeld },
        { label: "Niet aangemeld", aantal: d.huurNietAangemeld },
        { label: "Wil niet aanmelden", aantal: d.wilNietAanmelden }
      ], [kleuren.groen, kleuren.cyaan, kleuren.rood]),
      kaartGroot_("Wil niet aanmelden", d.wilNietAanmelden, "huisnummers")
    ];
    var breed = [
      kaartLijngrafiek_("Per week — nieuwe aanmeldingen", d.perWeek, kleuren.groen)
    ];
    verdeelInKolommen_(grid, normaal, breed);
  }

  document.getElementById("form-login").addEventListener("submit", function (event) {
    event.preventDefault();
    var huisnummer = document.getElementById("dashboard-huisnummer").value.trim();
    var pincode = document.getElementById("dashboard-pincode").value.trim();
    var status = document.getElementById("login-status");
    var knop = document.getElementById("knop-inloggen");
    if (!huisnummer || !/^\d{4}$/.test(pincode)) {
      status.textContent = "Vul een huisnummer en 4-cijferige pincode in.";
      return;
    }
    status.textContent = "Bezig met laden...";
    knop.disabled = true;

    fetch(DASHBOARD_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ verzoekType: "dashboard-gegevens", huisnummer: huisnummer, pincode: pincode })
    })
      .then(function (response) { return response.json(); })
      .then(function (json) {
        knop.disabled = false;
        if (json && json.ok) {
          status.textContent = "";
          document.getElementById("login-kaart").hidden = true;
          document.getElementById("dashboard-paneel").hidden = false;
          toonReparatieverzoeken_(json.reparatieverzoeken);
          toonAanmeldingen_(json.aanmeldingen);
        } else {
          status.textContent = (json && json.error) || "Kon niet inloggen.";
        }
      })
      .catch(function () {
        knop.disabled = false;
        status.textContent = "Kon geen verbinding maken. Controleer uw internetverbinding.";
      });
  });
</script>
